[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-sql-duckdb-agent"
version = "0.1.0"
description = "NL to SQL agent over DuckDB where the LLM proposes SQL and code decides what runs: a two-layer adversarial read-only validator, a locked read-only executor and execution-accuracy evals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaffeth Alfaro" }]
keywords = ["llm", "agent", "text-to-sql", "duckdb", "sql-injection", "pydantic", "evals"]
dependencies = [
    "duckdb>=1.5,<2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.1"]
watsonx = ["ibm-watsonx-ai>=1.1"]
groq = ["groq>=0.9"]
huggingface = ["huggingface_hub>=0.24"]
ollama = ["ollama>=0.4"]

[project.scripts]
nl-sql-agent = "nl_sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
